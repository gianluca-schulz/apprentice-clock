name: apprentice-clock
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apprentice-clock
      POSTGRES_USER: apprentice-clock
      POSTGRES_PASSWORD: apprentice-clock
    ports:
      - "5433:5432"
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apprentice-clock -d apprentice-clock"]
      interval: 5s
      timeout: 5s
      retries: 10   

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://apprentice-clock:apprentice-clock@postgres:5432/apprentice-clock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -i http://localhost:8000/api/v1/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
volumes:
  postgresql:
