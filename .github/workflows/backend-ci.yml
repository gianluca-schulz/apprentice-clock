name: linting, format and test automation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend_validation:
    defaults:
      run:
        working-directory: ./backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://apprentice-clock:apprentice-clock@localhost:5433/apprentice-clock
