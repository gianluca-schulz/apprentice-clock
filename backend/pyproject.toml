[project]
name = "backend"
version = "0.1.0"
description = "Backend for tracking apprentices' work hours. It requires the user to write a daily report for their training log before clocking out."
readme = "README.md"
authors = [
    { name = "Gianluca Schulz", email = "348162122+GianlucaSchulz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
